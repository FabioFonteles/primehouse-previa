<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Prime House - Belém Ananindeua</title><meta name="description" content="Casas em condomínios fechados em Belém, Ananindeua e Marituba."><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="style.css"></head><body>
<script src="data.js"></script><script src="condos.js"></script><script src="site.js"></script>
<main class="wrap detail" id="det"></main>
<script>
(()=>{const {I,esc,brl,m2,wa,houses}=PH;const id=new URLSearchParams(location.search).get('id');const c=houses().find(h=>h.id===id);const el=document.getElementById('det');
if(!c){el.innerHTML='<a class="text-link" href="index.html#casas">Voltar às casas</a><div class="empty" style="margin-top:30px">Esta casa não está mais disponível. <a class="text-link" href="index.html#casas">Ver as casas</a></div>';return}
document.title=`Casa no ${c.cond} · ${brl(c.valor)} · Prime House - Belém Ananindeua`;
const url=location.href.split('#')[0];
const msg=`Olá! Gostaria de perguntar sobre este imóvel:\nCasa no ${c.cond}, em ${c.cidade}.\n${c.q} quartos${c.area?` · ${m2(c.area)} m² de construção`:''} · ${brl(c.valor)}.\n${url}`;
const msg2=`Olá! Tenho interesse nesta casa:\nCasa no ${c.cond}, em ${c.cidade}.\n${c.q} quartos${c.area?` · ${m2(c.area)} m² de construção`:''} · ${brl(c.valor)}.\n${url}`;
const stats=[c.area&&[m2(c.area)+' m²','Construção'],[c.q,'Quartos'],[c.s,'Suítes privativas'],[c.vagas,'Vagas cobertas']].filter(Boolean);
const dif=(c.dif||[]).map(d=>d.charAt(0).toUpperCase()+d.slice(1));
el.innerHTML=`<a class="text-link" href="index.html#casas">Voltar às casas</a><div class="detail-top"><div><div class="eyebrow">${esc(c.cidade)}${c.bairro&&c.bairro!=='Centro'?' · '+esc(c.bairro):''}</div><h1 style="font-size:clamp(34px,4vw,56px)">Casa no ${esc(c.cond)}</h1></div><div class="price">${brl(c.valor)}</div></div>
<img class="detail-photo" id="ph" src="${esc(c.img[0])}" alt="Casa no ${esc(c.cond)}, foto 1">
<div class="thumbs" id="th">${c.img.map((s,i)=>`<button type="button" class="${i?'':'active'}" aria-label="Ver foto ${i+1}" data-i="${i}"><img src="${esc(s)}" alt="" loading="lazy"></button>`).join('')}</div>
<div class="detail-layout"><div><h2>Espaço para viver bem.</h2><div class="stats" style="--n:${stats.length}">${stats.map(s=>`<div class="stat"><strong>${s[0]}</strong><small>${s[1]}</small></div>`).join('')}</div><p>${esc(c.desc)}</p>${dif.length?`<h3>Diferenciais da casa</h3><ul>${dif.map(d=>`<li>${esc(d)}</li>`).join('')}</ul>`:''}<p>Valores e disponibilidade sujeitos à confirmação no atendimento.</p></div>
<aside class="contact-box"><div class="eyebrow">ATENDIMENTO PRIME HOUSE</div><h3>Vamos conhecer esta casa?</h3><p>Fale com o corretor e combine sua visita.</p><a class="btn" href="${wa(msg)}" target="_blank" rel="noreferrer">${I.msg} Pergunte ao corretor sobre esse imóvel</a><a class="btn secondary" href="${wa(msg2)}" target="_blank" rel="noreferrer">${I.heart} Tenho interesse nesta casa</a><p style="font-size:13px">CRECI 9493 · Exija o CRECI</p></aside></div>`;
const ph=document.getElementById('ph'),bs=[...document.querySelectorAll('#th button')];let cur=0;
const show=i=>{cur=(i+c.img.length)%c.img.length;ph.classList.add('fade');setTimeout(()=>{ph.src=c.img[cur];ph.alt=`Casa no ${c.cond}, foto ${cur+1}`;ph.classList.remove('fade')},150);bs.forEach((b,k)=>b.classList.toggle('active',k===cur));bs[cur].scrollIntoView({block:'nearest',inline:'nearest',behavior:'smooth'})};
bs.forEach(b=>b.onclick=()=>show(+b.dataset.i));ph.onclick=()=>show(cur+1);
document.addEventListener('keydown',e=>{if(document.getElementById('reg').classList.contains('on'))return;if(e.key==='ArrowRight')show(cur+1);if(e.key==='ArrowLeft')show(cur-1)});
})();
</script>
</body></html>
