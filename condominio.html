<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Prime House - Belém Ananindeua</title><meta name="description" content="Casas em condomínios fechados em Belém, Ananindeua e Marituba."><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="style.css"></head><body>
<script src="data.js"></script><script src="condos.js"></script><script src="site.js"></script>
<main class="wrap detail" id="det"></main>
<script>(()=>{const {esc,wa,cardHTML,condList}=PH;const id=new URLSearchParams(location.search).get('id');const c=condList().find(x=>x.id===id);const el=document.getElementById('det');
if(!c){el.innerHTML='<a class="text-link" href="condominios.html">Voltar aos condomínios</a><div class="empty" style="margin-top:30px">Condomínio não encontrado.</div>';return}
document.title=c.nome+' · Prime House - Belém Ananindeua';
const n=c._houses.length,cn=n?c._houses[0].cond:c.nome;
el.innerHTML=`<a class="text-link" href="condominios.html">Voltar aos condomínios</a><div class="detail-top"><div><div class="eyebrow">${esc(c.cidade)}</div><h1 style="font-size:clamp(34px,4vw,56px)">${esc(c.nome)}</h1></div>${n?`<a class="btn secondary" href="index.html?condominio=${encodeURIComponent(cn)}#casas">Casas disponíveis aqui · ${n}</a>`:''}</div>
${c.real?`<div class="condo-photos">${c.fotos.map((f,i)=>`<button type="button" data-i="${i}" aria-label="Ampliar foto ${i+1}"><img src="${f}" alt="${esc(c.nome)}, área comum, foto ${i+1}" loading="lazy"></button>`).join('')}</div>`:''}
<div class="detail-layout"><div><h2>Escolha onde viver.</h2><p>${esc(c.resumo)}</p>${c.local?`<p>${esc(c.local)}</p>`:''}${c.tamanho?`<p>${esc(c.tamanho)}</p>`:''}${c.lazer&&c.lazer.length?`<h3>Lazer do condomínio</h3><ul>${c.lazer.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}${c.seg&&c.seg.length?`<h3>Segurança</h3><ul>${c.seg.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}<p style="font-size:12px">Informações do material dos imóveis.</p></div>
<aside class="contact-box"><div class="eyebrow">ATENDIMENTO PRIME HOUSE</div><h3>Quer uma casa aqui?</h3><p>Fale com o corretor e encontre sua casa neste condomínio.</p><a class="btn" href="${wa('Olá! Quero uma casa no condomínio '+c.nome+'.')}" target="_blank" rel="noreferrer">${PH.I.msg} Quero uma casa aqui</a><p style="font-size:13px">CRECI 9493 · Exija o CRECI</p></aside></div>
${n?`<section class="section"><div class="section-head"><div><div class="eyebrow">NOSSA SELEÇÃO</div><h2>Casas neste condomínio.</h2></div><small>${n} ${n===1?'imóvel':'imóveis'} na seleção</small></div><div class="grid">${c._houses.slice().sort((a,b)=>a.valor-b.valor).map(cardHTML).join('')}</div></section>`:''}`;
if(c.real){const lb=document.createElement('div');lb.className='lightbox';lb.innerHTML='<button class="lx" aria-label="Fechar">×</button><button class="lp" aria-label="Anterior">‹</button><img alt=""><button class="ln" aria-label="Próxima">›</button>';document.body.appendChild(lb);let k=0;const im=lb.querySelector('img');const sh=i=>{k=(i+c.fotos.length)%c.fotos.length;im.src=c.fotos[k];im.alt=c.nome+', foto '+(k+1)};
 el.querySelectorAll('.condo-photos button').forEach(b=>b.onclick=()=>{sh(+b.dataset.i);lb.classList.add('on')});lb.querySelector('.lx').onclick=()=>lb.classList.remove('on');lb.querySelector('.lp').onclick=()=>sh(k-1);lb.querySelector('.ln').onclick=()=>sh(k+1);lb.onclick=e=>{if(e.target===lb)lb.classList.remove('on')};
 document.addEventListener('keydown',e=>{if(!lb.classList.contains('on'))return;if(e.key==='Escape')lb.classList.remove('on');if(e.key==='ArrowRight')sh(k+1);if(e.key==='ArrowLeft')sh(k-1)})}
})();</script>
</body></html>
