<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Prime House - Belém Ananindeua</title><meta name="description" content="Casas em condomínios fechados em Belém, Ananindeua e Marituba."><link rel="icon" type="image/png" sizes="32x32" href="favicon.png"><link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta property="og:type" content="website"><meta property="og:site_name" content="Prime House"><meta property="og:title" content="Prime House - Belém Ananindeua"><meta property="og:description" content="Casas em condomínios fechados em Belém, Ananindeua e Marituba."><meta property="og:image" content="https://primehousebelem.com.br/img/og-prime-house.jpg"><meta property="og:locale" content="pt_BR"><meta name="twitter:card" content="summary_large_image"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""><link rel="stylesheet" href="style.css"></head><body>
<script src="data.js"></script><script src="condos.js"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script><script src="site.js"></script>
<main class="wrap detail" id="det"></main>
<script>(()=>{const {esc,wa,cardHTML,condList,houseLine,I,mountMiniMap}=PH;const id=new URLSearchParams(location.search).get('id');const c=condList().find(x=>x.id===id);const el=document.getElementById('det');
if(!c){el.innerHTML='<a class="text-link" href="condominios.html">Voltar aos condomínios</a><div class="empty" style="margin-top:30px">Condomínio não encontrado.</div>';return}
document.title=c.nome+' · Prime House - Belém Ananindeua';
const n=c._houses.length,ul=a=>a&&a.length?`<ul>${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'';
el.innerHTML=`<a class="text-link" href="condominios.html">Voltar aos condomínios</a><div class="detail-top"><div><div class="eyebrow">${esc(c.cidade)}${c.bairro?' · '+esc(c.bairro):''}</div><h1 style="font-size:clamp(34px,4vw,56px)">${esc(c.nome)}</h1></div>${n?`<a class="btn secondary" href="index.html?condominio=${encodeURIComponent(c._houses[0].cond)}#casas">Casas disponíveis aqui · ${n}</a>`:''}</div>
<div class="detail-layout" style="margin-top:0"><div><h2>Escolha onde viver.</h2><p>${esc(c.resumo)}</p>
<h3>Endereço</h3><p>${esc(c.local)}<br><a class="text-link" href="${c.maps}" target="_blank" rel="noreferrer">Ver no Google Maps</a></p>
${c.construtora?`<h3>Construtora</h3><p>${esc(c.construtora)}</p>`:''}${c.tamanho?`<h3>Lotes</h3><p>${esc(c.tamanho)}</p>`:''}
${c.lazer&&c.lazer.length?`<h3>Lazer do condomínio</h3>${ul(c.lazer)}`:''}${c.seg&&c.seg.length?`<h3>Segurança</h3>${ul(c.seg)}`:''}
<h3>Casas disponíveis aqui · ${n}</h3>${n?`<ul class="condo-houses">${c._houses.map(houseLine).join('')}</ul>`:'<p>Sem casas no nosso catálogo no momento.</p>'}
<p style="font-size:12px">Informações do material dos imóveis.</p></div>
<aside class="contact-box"><div class="eyebrow">ATENDIMENTO PRIME HOUSE</div><h3>Quer uma casa aqui?</h3><p>Fale com o corretor e encontre sua casa neste condomínio.</p><a class="btn" href="${wa('Olá! Quero uma casa no condomínio '+c.nome+'.')}" target="_blank" rel="noreferrer">${I.msg} Quero uma casa aqui</a><p style="font-size:13px">CRECI 9493 · Exija o CRECI</p></aside></div>
${c.lat?`<section class="map-detail" id="mapa-condo"><h2>Localização aproximada</h2><p>${esc(c.local)}. A localização das casas não é exibida.</p><div id="mapa-canvas" class="map-canvas map-canvas-detail" role="region" aria-label="Mapa do condomínio"></div></section>`:''}
${n?`<section class="section"><div class="section-head"><div><div class="eyebrow">NOSSA SELEÇÃO</div><h2>Casas neste condomínio.</h2></div><small>${n} ${n===1?'imóvel':'imóveis'} na seleção</small></div><div class="grid">${c._houses.map(cardHTML).join('')}</div></section>`:''}`;
if(c.lat)mountMiniMap('mapa-canvas',c);
})();</script>
</body></html>
