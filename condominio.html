<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Condomínio · Prime House — As melhores casas de Belém e Ananindeua</title><meta name="description" content="Prime House: as melhores casas de Belém e Ananindeua. Arquitetura, fino acabamento e qualidade em todos os detalhes."><link rel="stylesheet" href="style.css"></head><body data-solid="1">
<script src="data.js"></script><script src="condos.js"></script>

<script src="main.js"></script><script>const c=CONDS.find(x=>x.id==new URLSearchParams(location.search).get("id"))||CONDS[0];document.title=c.nome+" · Conheça os condomínios · Prime House";
hi.src=`img/${c.img}.jpg`;hi.alt=c.nome;hl.textContent=c.cidade;hn.textContent=c.nome;hr.textContent=c.resumo;
const li=(t,a)=>a&&a.length?`<div class="eyebrow">${t}</div><ul class="lux" style="margin-top:18px">${a.map(x=>`<li>${x}</li>`).join("")}</ul>`:"";

const k=CASAS.filter(x=>x.cid==c.id);if(k.length)hc.innerHTML=k.map(card).join("");else hcs.querySelector(".sec-h").insertAdjacentHTML("afterend",'<p>No momento não há casas deste condomínio na coleção. Fale com o corretor para saber das oportunidades.</p>');
hf.textContent="Fontes: "+c.fontes.join(" · ")+". Informações sujeitas a confirmação.";
hw.href=wa(`Olá! Gostaria de falar com o corretor sobre casas à venda no condomínio ${c.nome}.`);reveal()</script>
